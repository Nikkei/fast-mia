# Benchmark configuration for SURP (Surprising Token Selection, arXiv:2407.21248)
# Run with:
#   uv run --with 'vllm==0.29.0' python main.py --config config/benchmark_surp.yaml --detailed-report
# Note: `prompt_logprobs: 20` enables top-K Shannon entropy filtering; set to `0` for causal window mode.
# On T4 GPUs (no bfloat16), add `dtype: float16` under `model`.

model:
  model_id: "EleutherAI/pythia-2.8b"
  trust_remote_code: true
  max_num_seqs: 64

sampling_parameters:
  max_tokens: 1
  prompt_logprobs: 20
  temperature: 0.0
  top_p: 1.0

data:
  data_path: "swj0419/WikiMIA"
  format: "huggingface"
  text_column: "input"
  label_column: "label"
  text_length: 32
  space_delimited_language: true

methods:
  - type: "loss"
    params: {}
  - type: "lower"
    params: {}
  - type: "zlib"
    params: {}
  - type: "mink"
    params:
      ratio: 0.2
  - type: "surp"
    params:
      ratio: 0.2
      entropy_percentile: 50.0
  - type: "surp"
    params:
      ratio: 0.4
      entropy_percentile: 50.0

output_dir: "./results"
